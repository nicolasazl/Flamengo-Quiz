<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flamengo Quiz</title>
<style>
:root{--red:#d6001c;--red2:#ff2d3f;--black:#0b0b0d;--card:#17171b;--line:#2a2a31;--white:#fff;--mut:#a7a7b2;--ok:#1fbf6b;--bad:#ff4d4d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1000px 500px at 50% -10%,#5a0010 0%,transparent 60%),repeating-linear-gradient(0deg,#0b0b0d 0 38px,#120b0d 38px 76px);background-attachment:fixed;color:var(--white);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.screen{display:none;animation:in .4s ease}.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1,h2{margin:0;font-weight:900;letter-spacing:.5px;text-transform:uppercase}
.logo{width:116px;height:116px;border-radius:50%;margin:24px auto 14px;border:4px solid #fff;background:repeating-linear-gradient(0deg,var(--red) 0 14px,#000 14px 28px);display:grid;place-items:center;box-shadow:0 0 0 4px var(--red),0 10px 40px #d6001c88;animation:pulse 3s ease-in-out infinite}
.logo b{background:#000;color:#fff;padding:6px 10px;font-size:26px;border-radius:6px;border:2px solid #fff}
@keyframes pulse{50%{transform:scale(1.05)}}
.hero{text-align:center}.hero h1{font-size:clamp(34px,10vw,52px);line-height:1}.hero h1 span{color:var(--red2)}
.hero p{color:var(--mut);margin:10px 0 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.btn{display:block;width:100%;padding:16px;border:0;border-radius:14px;font:800 17px inherit;font-family:inherit;color:#fff;background:linear-gradient(135deg,var(--red),#8f0012);cursor:pointer;text-transform:uppercase;letter-spacing:1px;box-shadow:0 8px 24px #d6001c55;transition:transform .15s,filter .15s;margin-top:10px}
.btn:hover{filter:brightness(1.15)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;border:2px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
label{font-weight:700;display:block;margin-bottom:8px}
input[type=text]{width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);background:#0e0e11;color:#fff;font-size:18px;outline:0}
input[type=text]:focus{border-color:var(--red2)}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}
.lv{display:grid;gap:10px}
.lv input{display:none}
.lv label{margin:0;padding:12px 14px;border:2px solid var(--line);border-radius:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:.2s}
.lv label small{color:var(--mut);font-weight:500}
.lv input:checked+label{border-color:var(--red2);background:#d6001c22}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:10px;gap:8px}
.pill{background:#000;border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-size:14px}
.bar{height:8px;background:#26262c;border-radius:9px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--red),var(--red2));transition:width .1s linear}
.bar.low i{background:#ffb020}
.cat{color:var(--red2);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:1px}
.q{font-size:21px;font-weight:800;margin:8px 0 18px;line-height:1.3}
.opt{display:block;width:100%;text-align:left;padding:15px;margin-bottom:10px;border-radius:12px;border:2px solid var(--line);background:#0e0e11;color:#fff;font:600 16px inherit;font-family:inherit;cursor:pointer;transition:.2s}
.opt:hover:not(:disabled){border-color:var(--red2);transform:translateX(4px)}
.opt:disabled{cursor:default}
.opt.ok{background:#1fbf6b33;border-color:var(--ok);animation:pop .4s}
.opt.bad{background:#ff4d4d33;border-color:var(--bad);animation:shake .4s}
@keyframes pop{50%{transform:scale(1.03)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{display:none;padding:12px 14px;border-radius:12px;margin-top:4px;font-size:15px;line-height:1.4}
.fb.ok{display:block;background:#1fbf6b22;border-left:4px solid var(--ok)}
.fb.bad{display:block;background:#ff4d4d22;border-left:4px solid var(--bad)}
.big{font-size:64px;font-weight:900;text-align:center;color:var(--red2);line-height:1;margin:6px 0}
.center{text-align:center}.mut{color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stats div{background:#0e0e11;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stats b{display:block;font-size:22px}.stats span{font-size:12px;color:var(--mut)}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{font-size:12px;color:var(--mut);text-transform:uppercase;text-align:left;padding:6px 4px}
.tbl td{padding:11px 4px;border-top:1px solid var(--line)}
.tbl tr.me td{background:#d6001c33;font-weight:800}
.tbl td:first-child{width:44px;font-weight:900;color:var(--red2)}
.tbl .n{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
select{width:100%;padding:12px;border-radius:12px;background:#0e0e11;color:#fff;border:2px solid var(--line);font-size:16px;margin-bottom:12px}
.wrap{overflow-x:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.ph{background-size:cover;background-position:center}
.cover{position:relative;max-width:380px;margin:-20px auto 0;height:300px;border-radius:0 0 30px 30px;overflow:hidden}
.cover .ph{position:absolute;inset:0;background-image:var(--i-cover);background-position:center 20%;filter:grayscale(1) contrast(1.1);animation:zoom 14s ease-in-out infinite alternate}
@keyframes zoom{to{transform:scale(1.07)}}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,#0b0b0d 100%),linear-gradient(135deg,#d6001c66,transparent 60%)}
.coverwrap{position:relative;margin:0 -16px}
.crest{position:absolute;left:50%;bottom:-46px;transform:translateX(-50%);width:96px;height:96px;border-radius:50%;background:#fff var(--i-logo) center/78% no-repeat;border:4px solid var(--red);box-shadow:0 8px 30px #d6001c88;z-index:2}
.hero h1{margin-top:58px}
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:26px -16px 0;padding:0 16px 8px}
.strip .ph{flex:0 0 70%;max-width:240px;height:150px;border-radius:14px;border:1px solid var(--line);scroll-snap-align:center;transition:transform .3s}
.strip .ph:hover{transform:scale(1.03)}
.banner{height:110px;border-radius:18px;margin-bottom:14px;position:relative;overflow:hidden;border:1px solid var(--line)}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,#0b0b0d 100%)}
.qimg{height:140px;border-radius:12px;margin-bottom:14px;background-size:cover;background-position:center 30%;position:relative;overflow:hidden;animation:in .5s ease}
.qimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,var(--card) 100%),linear-gradient(135deg,#d6001c55,transparent 60%)}
@media(min-width:600px){.qimg{height:170px}}
.sync{min-height:20px;font-size:14px;color:var(--mut);text-align:center;margin:8px 0}.sync.err{color:var(--bad)}.sync.ok{color:var(--ok)}
</style>
</head>

</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== CONFIG (expansível: novos níveis, categorias, perguntas e modos) ===== */
const LEVELS={
  facil:{label:'Torcedor',desc:'20s por pergunta',time:20,mult:1},
  medio:{label:'Craque',desc:'20s · pontos ×1,5',time:20,mult:1.5},
  dificil:{label:'Lenda',desc:'15s · pontos ×2',time:15,mult:2}
};
const MODES={classico:{questions:10}};
const IMGS=['i2019','i81team','zico','i81','jj','mara']; // fotos que decoram as perguntas // novos modos entram aqui
// q: pergunta · o: opções · a: índice correto · x: explicação
const Q=(l,c,q,o,a,x)=>({l,c,q,o,a,x});
const QUESTIONS=[
 Q('facil','História','Em que ano o Flamengo foi fundado?',['1895','1911','1902','1950'],0,'O clube foi fundado em 15 de novembro de 1895.'),
 Q('facil','Símbolos','Qual é o mascote do Flamengo?',['Urubu','Leão','Tigre','Águia'],0,'O Urubu é o mascote do Flamengo.'),
 Q('facil','Símbolos','Quais são as cores do Flamengo?',['Vermelho e preto','Azul e branco','Verde e branco','Preto e branco'],0,'O rubro-negro tem o vermelho e o preto em listras horizontais.'),
 Q('facil','Geral','Em qual cidade fica o Flamengo?',['Rio de Janeiro','São Paulo','Salvador','Belo Horizonte'],0,'O Flamengo é do Rio de Janeiro.'),
 Q('facil','Ídolos','Qual é o apelido do Zico?',['Galinho de Quintino','Fenômeno','Imperador','Pelé Branco'],0,'Zico é conhecido como Galinho de Quintino.'),
 Q('facil','Estádios','Qual estádio famoso do Rio o Flamengo usa como casa em grandes jogos?',['Maracanã','Morumbi','Mineirão','Beira-Rio'],0,'O Maracanã é a casa do Flamengo nos grandes jogos.'),
 Q('facil','Ídolos','Qual é o nome verdadeiro do Gabigol?',['Gabriel Barbosa','Gabriel Jesus','Gabriel Menino','Gabriel Pec'],0,'Gabigol é Gabriel Barbosa.'),
 Q('facil','História','Qual esporte deu origem ao clube, antes do futebol?',['Remo','Natação','Vôlei','Basquete'],0,'O nome "Clube de Regatas" vem do remo, esporte de origem do clube.'),
 Q('facil','Geral','Qual é o nome completo do clube?',['Clube de Regatas do Flamengo','Clube Atlético Flamengo','Sport Club Flamengo','Flamengo Futebol Clube'],0,'O nome oficial é Clube de Regatas do Flamengo.'),
 Q('facil','Torcida','Como a torcida do Flamengo é conhecida?',['Nação Rubro-Negra','Fiel Torcida','Massa Azul','Alviverde'],0,'A torcida é chamada de Nação Rubro-Negra.'),
 Q('medio','Títulos','Quem o Flamengo enfrentou na final da Libertadores de 1981?',['Cobreloa','Peñarol','Boca Juniors','Nacional'],0,'O Flamengo venceu o Cobreloa, do Chile, e foi campeão da Libertadores de 1981.'),
 Q('medio','Títulos','Quem era o técnico do Flamengo campeão brasileiro e da Libertadores em 2019?',['Jorge Jesus','Tite','Abel Braga','Rogério Ceni'],0,'Jorge Jesus comandou a campanha histórica de 2019.'),
 Q('medio','Ídolos','Quem é o maior artilheiro da história do Flamengo?',['Zico','Dida','Gabigol','Júnior'],0,'Zico marcou 508 gols pelo clube.'),
 Q('medio','Títulos','Quem o Flamengo enfrentou na final da Libertadores de 2019, em Lima?',['River Plate','Boca Juniors','Palmeiras','Grêmio'],0,'Virada por 2 a 1 sobre o River Plate.'),
 Q('medio','Cultura','Quem compôs o hino oficial do Flamengo?',['Lamartine Babo','Noel Rosa','Cartola','Pixinguinha'],0,'O hino é de autoria de Lamartine Babo.'),
 Q('medio','Títulos','Em que ano o Flamengo conquistou seu primeiro Campeonato Brasileiro?',['1980','1978','1990','1983'],0,'O primeiro título brasileiro foi em 1980.'),
 Q('medio','Títulos','Em que cidade foi a final da Libertadores de 2022?',['Guayaquil','Lima','Montevidéu','Santiago'],0,'A final foi em Guayaquil, no Equador: Flamengo 1 a 0 Athletico-PR.'),
 Q('medio','Títulos','Qual título mundial o Flamengo conquistou em 1981?',['Mundial Interclubes','Copa das Confederações','Recopa Sul-Americana','Copa Mercosul'],0,'Em 1981 o Flamengo foi campeão do mundo sobre o Liverpool.'),
 Q('medio','Títulos','Quem o Flamengo derrotou na final da Libertadores de 2025?',['Palmeiras','River Plate','Atlético-MG','Boca Juniors'],0,'O Flamengo foi campeão da Libertadores de 2025 ao vencer o Palmeiras na final, em Lima.'),
 Q('medio','Ídolos','Para qual clube italiano o Zico se transferiu em 1983?',['Udinese','Milan','Juventus','Roma'],0,'Zico jogou na Udinese a partir de 1983.'),
 Q('dificil','Títulos','Qual foi o placar da final do Mundial de 1981 contra o Liverpool?',['3 a 0','2 a 1','1 a 0','4 a 1'],0,'Flamengo 3 a 0 Liverpool, em Tóquio.'),
 Q('dificil','Títulos','Quem marcou dois gols na final do Mundial de 1981?',['Nunes','Zico','Adílio','Tita'],0,'Nunes marcou dois e Adílio fez o outro.'),
 Q('dificil','Títulos','Quantos gols Gabigol marcou na final da Libertadores de 2019?',['2','1','3','Nenhum'],0,'Gabigol marcou os dois gols da virada, nos minutos finais.'),
 Q('dificil','Títulos','Quem era o técnico do Flamengo no Mundial de 1981?',['Paulo César Carpegiani','Telê Santana','Cláudio Coutinho','Zagallo'],0,'Carpegiani comandou o time campeão em 1981.'),
 Q('dificil','Títulos','Em que cidade foi disputado o Mundial de 1981?',['Tóquio','Yokohama','Montevidéu','Londres'],0,'A final foi em Tóquio, no Japão.'),
 Q('dificil','História','Em que ano foi criado o departamento de futebol do Flamengo?',['1911','1895','1920','1900'],0,'O futebol chegou ao clube em 1911.'),
 Q('dificil','Títulos','Qual atacante, apelidado de "Imperador", foi campeão brasileiro pelo Flamengo em 2009?',['Adriano','Ronaldo','Romário','Edmundo'],0,'Adriano foi um dos protagonistas do título de 2009.'),
 Q('dificil','Estádios','Em qual bairro do Rio fica a sede social e o estádio histórico do clube?',['Gávea','Tijuca','Barra da Tijuca','Laranjeiras'],0,'A sede do Flamengo fica na Gávea.'),
 Q('dificil','Títulos','Quem o Flamengo derrotou na final do Campeonato Brasileiro de 1980?',['Atlético-MG','Internacional','Palmeiras','Vasco'],0,'O título de 1980 veio sobre o Atlético-MG.'),
 Q('dificil','Títulos','Em que ano o Flamengo conquistou sua primeira Copa do Brasil?',['1990','1989','1995','2006'],0,'A primeira Copa do Brasil rubro-negra foi em 1990.')
];

/* ===== SUPABASE (ranking global) =====
   Use SOMENTE a chave pública (publishable/anon). Nunca coloque secret/service_role aqui. */
const SUPABASE_URL='https://grtllrqfgnpwssqenfrg.supabase.co';
const SUPABASE_KEY='sb_publishable_u9MLQkrQuCmy995OofcSlA_SjdpuB1v';
const TABLE='quiz_scores';
// Nomes das colunas da tabela (ajuste aqui se o seu SQL usou outros nomes)
const COL={game:null,name:'player_name',level:'difficulty',hits:'correct_answers',answered:'answered',time:'time_seconds',score:'score',date:'created_at'};
// game: null = sem coluna de id da partida (anti-duplicata só no navegador). Para blindar também no banco, veja a nota no fim.

/* ===== CORE (lógica pura) ===== */
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const Core={
 shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r},
 validName(n){n=(n||'').trim().replace(/\s+/g,' ');return n.length>=2&&n.length<=16?n:null},
 id(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,11)},
 newGame(name,level,mode='classico'){
  const pool=QUESTIONS.filter(q=>q.l===level);
  const qs=this.shuffle(pool).slice(0,MODES[mode].questions).map(q=>({...q,opts:this.shuffle(q.o.map((t,i)=>({t,ok:i===q.a})))}));
  return{id:this.id(),name:this.validName(name),level,qs,imgs:this.shuffle(IMGS),i:0,hits:0,answered:0,time:0,score:0,streak:0,locked:false,saved:false}},
 grade(g,pick,remaining){
  const cfg=LEVELS[g.level],q=g.qs[g.i];g.locked=true;
  g.time+=cfg.time-remaining;
  if(pick!==null)g.answered++;
  const ok=pick!==null&&q.opts[pick].ok;
  if(ok){g.hits++;g.streak++;g.score+=Math.round((100+Math.round(remaining)*5+(g.streak>=3?20:0))*cfg.mult)}else g.streak=0;
  return ok},
 finish(g){ // devolve o registro UMA única vez; nunca sem nome
  if(g.saved||!g.name)return null;g.saved=true;
  return{id:g.id,name:g.name,level:g.level,hits:g.hits,answered:g.answered,time:Math.round(g.time*100)/100,score:g.score,ts:Date.now()}}
};

/* ===== SYNC (Supabase) ===== */
const Sync={
 client:null,reason:'',busy:new Set(),
 init(){
  if(!SUPABASE_KEY||SUPABASE_KEY.includes('COLE_AQUI')){this.reason='Falta configurar a chave pública do Supabase.';return}
  if(!window.supabase||!window.supabase.createClient){this.reason='Não foi possível carregar a biblioteca do Supabase.';return}
  try{this.client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}})}catch(e){this.reason='Erro ao iniciar o Supabase.'}},
 get ok(){return !!this.client},
 pending(){return LS.get('fq:pending:v2',[])},
 setPending(l){LS.set('fq:pending:v2',l)},
 sent(){return LS.get('fq:sent:v2',[])},
 markSent(id){const s=this.sent();if(!s.includes(id)){s.push(id);LS.set('fq:sent:v2',s.slice(-300))}},
 async insert(rec){ // 'ok' | 'dup' | 'err'
  if(!this.client)return 'err';
  const row={[COL.name]:rec.name,[COL.level]:rec.level,[COL.hits]:rec.hits,[COL.answered]:rec.answered,[COL.time]:rec.time,[COL.score]:rec.score};if(COL.game)row[COL.game]=rec.id;
  if(rec.tried&&!COL.game){try{if(await this.exists(rec))return 'dup'}catch(e){return 'err'}} // tentativa anterior de resultado incerto: confere se já entrou
  try{const {error}=await this.client.from(TABLE).insert(row);
   if(!error)return 'ok';if(error.code==='23505')return 'dup';console.error('Supabase insert:',error);return 'err'}
  catch(e){console.error('Supabase insert:',e);return 'err'}},
 async submit(rec){ // idempotente: não envia duas vezes o mesmo id
  if(this.sent().includes(rec.id))return 'ok';
  if(this.busy.has(rec.id))return 'busy';
  this.busy.add(rec.id);
  try{
   const r=await this.insert(rec);
   if(r==='ok'||r==='dup'){this.markSent(rec.id);this.setPending(this.pending().filter(p=>p.id!==rec.id));return 'ok'}
   rec.tried=true;
   if(!this.pending().some(p=>p.id===rec.id))this.setPending([...this.pending(),rec]);
   return 'err';
  }finally{this.busy.delete(rec.id)}},
 async flush(){for(const p of this.pending())await this.submit(p)},
 norm(r){return{id:r[COL.game]!=null?r[COL.game]:r.id,name:r[COL.name],level:r[COL.level],hits:+r[COL.hits],answered:+r[COL.answered],time:+r[COL.time],score:+r[COL.score]}},
 async exists(rec){const {count,error}=await this.client.from(TABLE).select('*',{count:'exact',head:true}).eq(COL.name,rec.name).eq(COL.level,rec.level).eq(COL.hits,rec.hits).eq(COL.answered,rec.answered).eq(COL.score,rec.score).eq(COL.time,rec.time).gte(COL.date,new Date(rec.ts-300000).toISOString());if(error)throw error;return count>0},
 async top(level,n=50){
  const {data,error}=await this.client.from(TABLE).select('*').eq(COL.level,level)
   .order(COL.hits,{ascending:false}).order(COL.answered,{ascending:false}).order(COL.time,{ascending:true}).order(COL.date,{ascending:true}).limit(n);
  if(error)throw error;return (data||[]).map(r=>this.norm(r))},
 async position(rec){ // 1 + quantos jogadores do mesmo nível estão à frente
  const {count,error}=await this.client.from(TABLE).select('*',{count:'exact',head:true}).eq(COL.level,rec.level)
   .or(`${COL.hits}.gt.${rec.hits},and(${COL.hits}.eq.${rec.hits},${COL.answered}.gt.${rec.answered}),and(${COL.hits}.eq.${rec.hits},${COL.answered}.eq.${rec.answered},${COL.time}.lt.${rec.time})`);
  if(error)throw error;return count+1}
};
/*DOM*/
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let G=null,LAST=null,T=null,t0=0,left=0,level='facil',lastName='',rt=0;
lastName=LS.get('fq:name','');
Sync.init();if(Sync.ok)Sync.flush();
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0);if(id==='rank'){$('#rFilter').value=level;renderRank()}if(id==='setup'){$('#name').value=lastName;$('#nameErr').textContent=''}}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{stop();show(b.dataset.go)});
function stop(){clearInterval(T);T=null}
$('#levels').innerHTML=Object.entries(LEVELS).map(([k,v])=>`<input type="radio" name="lv" id="lv-${k}" value="${k}" ${k===level?'checked':''}><label for="lv-${k}"><span>${v.label}</span><small>${v.desc}</small></label>`).join('');
$('#rFilter').innerHTML=Object.entries(LEVELS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');
$('#rFilter').onchange=renderRank;
$('#bReload').onclick=renderRank;
$('#bPlay').onclick=()=>show('setup');
$('#bPlayRank').onclick=()=>show('setup');
$('#bAgain').onclick=()=>show('setup');
$('#bRankHome').onclick=$('#bRankRes').onclick=()=>show('rank');
$('#name').addEventListener('keydown',e=>{if(e.key==='Enter')$('#bStart').click()});
$('#bStart').onclick=()=>{
  const n=Core.validName($('#name').value);
  if(!n){$('#nameErr').textContent='Informe seu nome (2 a 16 caracteres) para jogar.';$('#name').focus();return}
  level=document.querySelector('input[name=lv]:checked').value;lastName=n;LS.set('fq:name',n);
  G=Core.newGame(n,level);show('game');renderQ();
};
function renderQ(){
  const q=G.qs[G.i],cfg=LEVELS[G.level];
  $('#gLevel').textContent=cfg.label;$('#gProg').textContent=`${G.i+1}/${G.qs.length}`;$('#gScore').textContent=`${G.score} pts`;
  $('#gCat').textContent=q.c;const im=$('#gImg');im.style.backgroundImage=`var(--i-${G.imgs[G.i%G.imgs.length]})`;im.style.animation='none';void im.offsetWidth;im.style.animation='';
  $('#gQ').textContent=q.q;$('#bNext').style.display='none';
  const fb=$('#gFb');fb.className='fb';fb.textContent='';G.locked=false;
  $('#gOpts').innerHTML='';
  q.opts.forEach((o,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=o.t;b.onclick=()=>answer(i);$('#gOpts').appendChild(b)});
  left=cfg.time;t0=Date.now();updBar();stop();
  T=setInterval(()=>{left=Math.max(0,cfg.time-(Date.now()-t0)/1000);updBar();if(left<=0)answer(null)},100);
}
function updBar(){const c=LEVELS[G.level].time;$('#bar i').style.width=(left/c*100)+'%';$('#bar').classList.toggle('low',left/c<.3)}
function answer(pick){
  if(!G||G.locked)return;stop();
  const q=G.qs[G.i],ok=Core.grade(G,pick,left),btns=[...document.querySelectorAll('.opt')];
  btns.forEach((b,i)=>{b.disabled=true;if(q.opts[i].ok)b.classList.add('ok');else if(i===pick)b.classList.add('bad')});
  const fb=$('#gFb');fb.className='fb '+(ok?'ok':'bad');
  fb.textContent=(ok?'✔ Acertou! ':pick===null?'⏱ Tempo esgotado. ':'✘ Errou. ')+q.x;
  $('#gScore').textContent=`${G.score} pts`;
  const nx=$('#bNext');nx.textContent=G.i+1>=G.qs.length?'Ver resultado':'Próxima';nx.style.display='block';
}
$('#bNext').onclick=()=>{if(!G||!G.locked)return;if(G.i+1>=G.qs.length)end();else{G.i++;renderQ()}};
function end(){
  stop();const n=G.qs.length,r=G.hits/n;
  $('#rName').textContent=G.name;$('#rHits').textContent=`${G.hits}/${n}`;
  $('#rMsg').textContent=r===1?'Nação perfeita! 🔴⚫':r>=.7?'Grande jogo, rubro-negro!':r>=.4?'Bom, mas dá pra melhorar!':'Hora de estudar a história do Mengão!';
  $('#rScore').textContent=G.score;$('#rTime').textContent=Math.round(G.time)+'s';$('#rPos').textContent='…';
  show('result');
  const rec=Core.finish(G); // null se já registrada → sem duplicata
  if(rec){LAST=rec;send(rec)}
}
async function send(rec){
  const st=$('#rSync'),bt=$('#bRetry');bt.style.display='none';
  if(!Sync.ok){st.className='sync err';st.textContent=Sync.reason+' Seu resultado ficou guardado neste aparelho.';$('#rPos').textContent='-';Sync.submit(rec);return}
  st.className='sync';st.textContent='Enviando resultado ao ranking global…';
  const res=await Sync.submit(rec);
  if(res==='busy')return;
  if(res==='ok'){
    try{rec.pos=await Sync.position(rec);$('#rPos').textContent='#'+rec.pos}catch(e){$('#rPos').textContent='-'}
    st.className='sync ok';st.textContent='✔ Resultado registrado no ranking global.';
  }else{
    $('#rPos').textContent='-';st.className='sync err';
    st.textContent='Sem conexão com o ranking. Seu resultado está guardado e será reenviado.';bt.style.display='block';
  }
}
$('#bRetry').onclick=()=>{if(LAST)send(LAST)};
const isMe=r=>!!LAST&&(r.id===LAST.id||(r.name===LAST.name&&r.hits===LAST.hits&&r.answered===LAST.answered&&r.score===LAST.score&&Math.abs(r.time-LAST.time)<.01));
const rowHtml=(p,r,me)=>`<tr class="${me?'me':''}"><td>${p}º</td><td class="n">${esc(r.name)}</td><td>${r.hits}</td><td>${r.answered}</td><td>${Math.round(r.time)}s</td></tr>`;
async function renderRank(){
  const f=$('#rFilter').value,tk=++rt,st=$('#rStatus'),body=$('#rBody'),rl=$('#bReload');
  rl.style.display='none';$('#rEmpty').style.display='none';
  if(!Sync.ok){body.innerHTML='';st.className='sync err';st.textContent='Ranking global indisponível. '+Sync.reason;return}
  st.className='sync';st.textContent='Carregando ranking…';
  try{
    await Sync.flush();
    const list=await Sync.top(f);if(tk!==rt)return;
    st.textContent='';$('#rEmpty').style.display=list.length?'none':'block';
    let h=list.map((r,i)=>rowHtml(i+1,r,isMe(r))).join('');
    if(LAST&&LAST.level===f&&LAST.pos>list.length&&!list.some(isMe))h+=rowHtml(LAST.pos,LAST,true);
    body.innerHTML=h;
  }catch(e){
    if(tk!==rt)return;console.error(e);body.innerHTML='';
    st.className='sync err';st.textContent='Não foi possível carregar o ranking. Verifique sua conexão.';rl.style.display='block';
  }
}
</script>
